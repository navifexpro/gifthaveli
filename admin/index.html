<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Gift Haveli Admin</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
@font-face{font-family:"Fraunces";src:url(/Fraunces.ttf)}@font-face{font-family:"DM Sans";src:url(/DMSans.ttf)}
:root{--m:#6A1B2E;--g:#C9A24B;--c:#FAF3E7;--ink:#2B0F17;--mu:#6b5a4e}
*{box-sizing:border-box}body{margin:0;font-family:"DM Sans",system-ui,sans-serif;background:var(--c);color:var(--ink)}
h1,h2,h3{font-family:Fraunces,serif;color:var(--m);font-weight:560;margin:0 0 .4em}
header{background:var(--m);color:var(--c);display:flex;align-items:center;gap:16px;padding:12px 20px;position:sticky;top:0;z-index:5;flex-wrap:wrap}
header b{font-family:Fraunces;font-size:1.3rem}header nav{display:flex;gap:6px;flex-wrap:wrap}
header nav button{background:transparent;border:1px solid rgba(255,255,255,.3);color:var(--c);border-radius:999px;padding:.4em 1em;cursor:pointer;font:inherit}
header nav button.on{background:var(--g);color:var(--ink);border-color:var(--g)}
header .sp{flex:1}header a{color:#f0dcc4;font-size:.9rem}
main{padding:20px;max-width:1300px;margin:0 auto}
.btn{background:var(--m);color:var(--c);border:0;border-radius:999px;padding:.6em 1.2em;font:600 .9rem "DM Sans";cursor:pointer}
.btn.ghost{background:transparent;color:var(--m);border:1.5px solid var(--m)}.btn.sm{padding:.35em .8em;font-size:.8rem}.btn:disabled{opacity:.5}
input,select,textarea{font:inherit;padding:.55em .7em;border-radius:10px;border:1.5px solid rgba(106,27,46,.2);background:#fff;width:100%}
label{font-weight:600;font-size:.85rem;display:grid;gap:4px}
.card{background:#fff;border-radius:16px;padding:18px;border:1px solid rgba(201,162,75,.3)}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.bar input,.bar select{width:auto;min-width:160px}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden}
th,td{padding:8px 10px;border-bottom:1px solid #f0e6d6;text-align:left;font-size:.9rem;vertical-align:middle}
th{background:#f6ecdd;font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--mu)}
td img{width:46px;height:46px;object-fit:cover;border-radius:8px}
tr.off td{opacity:.45}
.pill{font-size:.72rem;padding:.15em .6em;border-radius:999px;background:#f3e6d3}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.modal{position:fixed;inset:0;background:rgba(43,15,23,.55);display:grid;place-items:center;padding:14px;z-index:20}
.sheet{background:var(--c);border-radius:20px;max-width:900px;width:100%;max-height:92vh;overflow:auto;padding:22px}
.gal{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}.gal div{position:relative}.gal img{width:84px;height:84px;object-fit:cover;border-radius:10px}
.gal button{position:absolute;top:2px;right:2px;background:#fff;border:0;border-radius:50%;width:22px;height:22px;cursor:pointer}
.gal .mv{right:auto;left:2px}
.msg{padding:10px 14px;border-radius:10px;background:#f3e6d3;margin:10px 0}.err{background:#f6d8d2}
.auth{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);background:#fff}
.auth-brand{position:relative;overflow:hidden;background:radial-gradient(120% 90% at 0% 0%,#842538 0%,var(--m) 45%,#4a1220 100%);color:var(--c);padding:48px 56px;display:flex;flex-direction:column;justify-content:space-between}
.auth-brand::after{content:"";position:absolute;right:-120px;bottom:-140px;width:460px;height:560px;border:2px solid rgba(201,162,75,.28);border-radius:230px 230px 0 0;box-shadow:0 0 0 28px rgba(201,162,75,.06),0 0 0 56px rgba(201,162,75,.04)}
.auth-brand img{height:46px;width:auto;align-self:flex-start;position:relative;z-index:1}
.auth-brand h1{color:var(--c);font-size:clamp(2rem,3.4vw,3rem);line-height:1.1;max-width:13ch;margin:0 0 14px}
.auth-brand p{color:#ead7c0;max-width:36ch;line-height:1.6;margin:0}
.auth-brand small{color:#cdb39a;font-size:.8rem;position:relative;z-index:1}
.auth-brand .gold{width:56px;height:3px;background:var(--g);border-radius:3px;margin:0 0 22px}
.auth-form{display:flex;align-items:center;justify-content:center;padding:40px 24px;background:var(--c)}
.auth-box{width:100%;max-width:400px}
.auth-box h2{font-size:1.9rem;margin:0 0 6px}.auth-box .sub{color:var(--mu);margin:0 0 26px}
.fld{display:grid;gap:6px;margin-bottom:16px}.fld>span{font-weight:600;font-size:.85rem}
.inp{position:relative;display:flex;align-items:center}
.inp svg{position:absolute;left:13px;width:18px;height:18px;stroke:var(--mu);fill:none;stroke-width:1.8;pointer-events:none}
.inp input{padding:.8em .9em .8em 2.6em;border-radius:12px;background:#fff;border:1.5px solid #e6d6c0;transition:border-color .15s,box-shadow .15s}
.inp input:focus{outline:0;border-color:var(--m);box-shadow:0 0 0 4px rgba(106,27,46,.1)}
.inp .eye{position:absolute;right:8px;background:none;border:0;cursor:pointer;padding:6px;border-radius:8px;display:grid;place-items:center}
.inp .eye svg{position:static}
.code input{letter-spacing:.5em;font-size:1.25rem;text-align:center;padding-left:.9em;font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center;margin:2px 0 22px;font-size:.9rem;gap:10px}
.chk{display:flex;align-items:center;gap:8px;font-weight:500;cursor:pointer;font-size:.9rem}.chk input{width:17px;height:17px;accent-color:var(--m);margin:0}
.lnk{background:none;border:0;color:var(--m);font:600 .9rem "DM Sans";cursor:pointer;padding:0;text-decoration:none}.lnk:hover{text-decoration:underline}
.btn.wide{width:100%;padding:.9em;font-size:1rem;border-radius:12px;display:flex;justify-content:center;align-items:center;gap:10px}
.btn.wide:hover{background:#561524}
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.note{padding:11px 14px;border-radius:12px;margin:0 0 18px;font-size:.9rem;line-height:1.45}
.note.err{background:#f8e0da;color:#7a1d22;border:1px solid #efc3b9}.note.ok{background:#eaf3e4;color:#2f5321;border:1px solid #cfe2c3}
.auth-foot{margin-top:26px;text-align:center;font-size:.85rem;color:var(--mu)}.auth-foot a{color:var(--mu)}
@media(max-width:860px){.auth{grid-template-columns:1fr}.auth-brand{padding:26px 24px;min-height:0}.auth-brand h1,.auth-brand p,.auth-brand .gold,.auth-brand small{display:none}.auth-brand::after{width:220px;height:260px;right:-60px;bottom:-150px}.auth-form{align-items:flex-start;padding-top:34px}}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:18px}.stats .card b{font-family:Fraunces;font-size:1.8rem;color:var(--m);display:block}
.items{display:flex;flex-wrap:wrap;gap:6px}.items label{display:flex;align-items:center;gap:6px;font-weight:400;background:#fff;border:1px solid #eadfcd;border-radius:999px;padding:.3em .8em}.items input{width:auto}
@media(max-width:760px){.grid2,.grid3{grid-template-columns:1fr}td:nth-child(n+6){display:none}}
</style>
</head>
<body>
<div id="root"></div>
<script src="/data.js"></script>
<script>
(() => {
  const D = window.GH, API = D.api, $ = s => document.querySelector(s), root = $("#root");
  const esc = t => String(t == null ? "" : t).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const src = r => !r ? "" : /^(p|assets)\//.test(r) ? "/" + r : /^https?:/.test(r) ? r : `https://lh3.googleusercontent.com/d/${r}=w300`;
  const store = { get: () => { try { return localStorage.getItem("gh_tok") || sessionStorage.getItem("gh_tok") || ""; } catch (e) { return ""; } },
    set: (t, remember) => { try { sessionStorage.removeItem("gh_tok"); localStorage.removeItem("gh_tok"); (remember ? localStorage : sessionStorage).setItem("gh_tok", t); } catch (e) {} },
    remembered: () => { try { return !!localStorage.getItem("gh_tok"); } catch (e) { return false; } },
    clear: () => { try { localStorage.removeItem("gh_tok"); sessionStorage.removeItem("gh_tok"); sessionStorage.removeItem("gh_admin"); } catch (e) {} } };
  let token = store.get(), data = null, orders = [], tab = "products", msg = "", adminUser = "";
  const call = async (action, extra = {}) => { const r = await fetch(API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action, token, ...extra }) }); return r.json(); };
  const ICON = { user: '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>',
    lock: '<svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>',
    eye: '<svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
    eyeOff: '<svg viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 5.1A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4M6.6 6.6C3.7 8.4 2 12 2 12s3.6 7 10 7a10 10 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>',
    key: '<svg viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M14 9l2 2"/></svg>' };
  const TYPES = ["Product", "Main Box"], CUSTOM = ["Both", "Photo", "Text", "None"];
  const typed = (arr, t) => (arr || []).map(x => { if (!x.type || x.type === "Product") x.type = t; return x; });
  const allItems = () => [...typed(data.products, "Product"), ...typed(data.boxes, "Main Box"), ...typed(data.fillers, "Box Item"), ...typed(data.addons, "Add-on")];
  const gal = x => (x.gallery && x.gallery.length) ? x.gallery : (D.gallery[x.id] || []);

  /* ---- login screens ---- */
  const savedUser = () => { try { return localStorage.getItem("gh_user") || ""; } catch (e) { return ""; } };
  const field = (label, name, type, icon, attrs = "") => `<label class="fld"><span>${label}</span><div class="inp">${ICON[icon]}<input name="${name}" type="${type}" ${attrs}>${type === "password" ? `<button type="button" class="eye" aria-label="Show password">${ICON.eye}</button>` : ""}</div></label>`;
  const note = (n) => n ? `<div class="note ${n.ok ? "ok" : "err"}" role="alert">${esc(n.text)}</div>` : "";
  function authPage(inner) {
    root.innerHTML = `<div class="auth"><aside class="auth-brand"><img src="/logo-reverse.svg" alt="Gift Haveli">
      <div style="position:relative;z-index:1"><div class="gold"></div><h1>Gifts that feel like home.</h1><p>Manage products, prices, gift boxes and orders for Gift Haveli, all in one place.</p></div>
      <small>Gift Haveli Admin · A Navifex Pro brand</small></aside>
      <section class="auth-form"><div class="auth-box">${inner}<div class="auth-foot"><a href="/">← Back to website</a></div></div></section></div>`;
    root.querySelectorAll(".eye").forEach(b => b.onclick = () => { const i = b.previousElementSibling, show = i.type === "password"; i.type = show ? "text" : "password"; b.innerHTML = show ? ICON.eyeOff : ICON.eye; b.setAttribute("aria-label", show ? "Hide password" : "Show password"); });
  }
  const busy = (btn, on, label) => { btn.disabled = on; btn.innerHTML = on ? `<span class="spin"></span>Please wait…` : label; };
  const post = (action, extra) => call(action, extra).catch(() => ({ ok: false, error: "Could not reach the server. Check the internet and try again." }));

  function login(n) {
    authPage(`<h2>Welcome back</h2><p class="sub">Sign in to the Gift Haveli dashboard.</p>${note(n)}
      <form id="lf" novalidate>${field("Username", "user", "text", "user", `autocomplete="username" autocapitalize="off" spellcheck="false" required value="${esc(savedUser())}"`)}
        ${field("Password", "pass", "password", "lock", 'autocomplete="current-password" required')}
        <div class="row"><label class="chk"><input type="checkbox" name="remember" ${savedUser() ? "checked" : ""}>Remember me</label><button type="button" class="lnk" id="fg">Forgot password?</button></div>
        <button class="btn wide" id="go">Sign in</button></form>`);
    const f = $("#lf"); (f.user.value ? f.pass : f.user).focus();
    $("#fg").onclick = () => forgot(null, f.user.value);
    f.onsubmit = async e => { e.preventDefault();
      if (!f.user.value.trim() || !f.pass.value) return login({ text: "Please enter your username and password." });
      const remember = f.remember.checked, user = f.user.value.trim(); busy($("#go"), true);
      const j = await post("admin_signin", { user, pass: f.pass.value, remember });
      if (!j.ok) { login({ text: j.error }); $("#lf").user.value = user; $("#lf").pass.focus(); return; }
      token = j.token; store.set(token, remember); adminUser = j.user;
      try { remember ? localStorage.setItem("gh_user", user) : localStorage.removeItem("gh_user"); } catch (e) {}
      load(); };
  }
  function forgot(n, user) {
    authPage(`<h2>Forgot password?</h2><p class="sub">Enter your username. We will email a 6-digit code to the Gift Haveli email.</p>${note(n)}
      <form id="ff">${field("Username", "user", "text", "user", `autocomplete="username" autocapitalize="off" spellcheck="false" required value="${esc(user || savedUser())}"`)}
        <button class="btn wide" id="go">Send code</button></form>
      <p style="text-align:center;margin-top:18px"><button class="lnk" id="bk">Back to sign in</button></p>`);
    const f = $("#ff"); f.user.focus(); $("#bk").onclick = () => login();
    f.onsubmit = async e => { e.preventDefault(); if (!f.user.value.trim()) return;
      const u = f.user.value.trim(); busy($("#go"), true);
      const j = await post("admin_forgot", { user: u });
      j.ok ? reset({ ok: true, text: j.message }, u) : forgot({ text: j.error }, u); };
  }
  function reset(n, user) {
    authPage(`<h2>Set a new password</h2><p class="sub">Enter the code from the email and choose a new password.</p>${note(n)}
      <form id="rf"><label class="fld code"><span>6-digit code</span><div class="inp"><input name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required></div></label>
        ${field("New password", "np", "password", "key", 'autocomplete="new-password" minlength="8" required')}
        ${field("Confirm new password", "np2", "password", "key", 'autocomplete="new-password" minlength="8" required')}
        <button class="btn wide" id="go">Change password</button></form>
      <p style="text-align:center;margin-top:18px;display:flex;justify-content:center;gap:18px"><button class="lnk" id="rs">Send a new code</button><button class="lnk" id="bk">Back to sign in</button></p>`);
    const f = $("#rf"); f.code.focus(); $("#bk").onclick = () => login(); $("#rs").onclick = () => forgot(null, user);
    f.onsubmit = async e => { e.preventDefault();
      if (!/^\d{6}$/.test(f.code.value.trim())) return reset({ text: "The code has 6 numbers." }, user);
      if (f.np.value.length < 8) return reset({ text: "Use at least 8 characters for the password." }, user);
      if (f.np.value !== f.np2.value) return reset({ text: "The two passwords do not match." }, user);
      busy($("#go"), true);
      const j = await post("admin_reset", { user, code: f.code.value.trim(), newPass: f.np.value });
      j.ok ? login({ ok: true, text: j.message }) : reset({ text: j.error }, user); };
  }
  async function load() {
    root.innerHTML = `<main><p>Loading…</p></main>`;
    const j = await call("admin_data").catch(() => ({ ok: false, error: "Could not reach the server." }));
    if (!j.ok) { store.clear(); token = ""; return login({ text: j.error }); }
    data = j.data; orders = j.orders || []; render();
  }
  function shell(body) {
    const tabs = [["products", "Products"], ["boxes", "Empty Boxes"], ["ready", "Gift Boxes"], ["orders", "Orders"], ["settings", "Settings"]];
    root.innerHTML = `<header><b>Gift Haveli Admin</b><nav>${tabs.map(([k, n]) => `<button data-t="${k}" class="${tab === k ? "on" : ""}">${n}</button>`).join("")}</nav><span class="sp"></span><a href="/" target="_blank">View website</a><button class="btn sm ghost" id="out" style="color:#fff;border-color:#fff">Log out</button></header>
      <main>${msg ? `<div class="msg">${esc(msg)}</div>` : ""}${body}</main>`;
    msg = "";
    document.querySelectorAll("[data-t]").forEach(b => b.onclick = () => { tab = b.dataset.t; render(); });
    $("#out").onclick = () => { post("admin_signout"); store.clear(); token = ""; login({ ok: true, text: "You have been signed out." }); };
  }
  function render() {
    if (tab === "products" || tab === "boxes") return renderList(tab === "products" ? ["Product"] : ["Main Box"]);
    if (tab === "ready") return renderReady();
    if (tab === "orders") return renderOrders();
    return renderSettings();
  }

  /* ---- products / boxes ---- */
  function renderList(types) {
    const list = allItems().filter(x => types.includes(x.type || "Product"));
    const cats = [...new Set(list.map(x => x.cat).filter(Boolean))].sort();
    shell(`<div class="stats"><div class="card"><b>${list.length}</b>items</div><div class="card"><b>${list.filter(x => x.show).length}</b>on website</div><div class="card"><b>${list.filter(x => !x.price).length}</b>without price</div><div class="card"><b>${list.filter(x => !gal(x).length).length}</b>without photos</div></div>
      <div class="bar"><input id="q" placeholder="Search name or ID"><select id="fc"><option value="">All categories</option>${cats.map(c => `<option>${esc(c)}</option>`).join("")}</select>
        <select id="fs"><option value="">All</option><option value="y">On website</option><option value="n">Hidden</option><option value="np">No price</option>${types[0] === "Product" ? `<option value="ib">Can go in box</option>` : ""}</select>
        <span class="sp" style="flex:1"></span><button class="btn" id="add">+ Add new</button></div>
      <table><thead><tr><th></th><th>ID</th><th>Name</th><th>Category</th><th>Price</th><th>${types[0] === "Product" ? "In box" : "Max items"}</th><th>Website</th><th></th></tr></thead><tbody id="tb"></tbody></table>`);
    const draw = () => {
      const q = $("#q").value.toLowerCase(), fc = $("#fc").value, fs = $("#fs").value;
      $("#tb").innerHTML = list.filter(x => (!q || (x.name + " " + x.id).toLowerCase().includes(q)) && (!fc || x.cat === fc) && (!fs || (fs === "y" ? x.show : fs === "n" ? !x.show : fs === "ib" ? x.inbox : !x.price)))
        .map(x => `<tr class="${x.show ? "" : "off"}"><td>${gal(x)[0] ? `<img src="${src(gal(x)[0])}" alt="">` : ""}</td><td>${esc(x.id)}</td><td>${esc(x.name)}</td><td>${esc(x.cat)}</td><td>${x.price ? "Rs " + x.price : "<span class=pill>no price</span>"}</td><td>${x.type === "Main Box" ? esc(x.slots || "") : x.inbox ? "<span class=pill>Yes</span>" : ""}</td>
          <td><button class="btn sm ${x.show ? "" : "ghost"}" data-sh="${x.id}">${x.show ? "Shown" : "Hidden"}</button></td><td><button class="btn sm ghost" data-ed="${x.id}">Edit</button></td></tr>`).join("");
      document.querySelectorAll("[data-ed]").forEach(b => b.onclick = () => edit(allItems().find(x => x.id === b.dataset.ed)));
      document.querySelectorAll("[data-sh]").forEach(b => b.onclick = async () => { const x = allItems().find(y => y.id === b.dataset.sh); b.disabled = true;
        const j = await call("admin_save_product", { p: { id: x.id, show: !x.show } }); if (j.ok) { x.show = !x.show; draw(); } else alert(j.error); });
    };
    ["q", "fc", "fs"].forEach(i => $("#" + i).oninput = draw); draw();
    $("#add").onclick = () => edit({ id: "", type: types[0], name: "", cat: "", price: 0, custom: types[0] === "Product" ? "both" : "none", show: true, gallery: [] });
  }
  const SIMPLE_CATS = ["Eatables", "Flowers", "Apparels", "Extras"];
  const catField = (type, cur, cats) => type === "Main Box"
    ? `Category<select name="cat"><option>Boxes</option></select>`
    : `Category<input name="cat" list="cats" value="${esc(cur)}" required><datalist id="cats">${[...new Set([...SIMPLE_CATS, ...cats.filter(c => c !== "Boxes" && c !== "Customized Items" && c !== "Add-ons")])].map(c => `<option>${esc(c)}</option>`).join("")}</datalist>
      <small style="font-weight:400;color:var(--mu)">Eatables, Flowers, Apparels and Extras are simple items for boxes. Any other category is a customized product.</small>`;
  function edit(x) {
    let g = [...gal(x)];
    const m = document.createElement("div"); m.className = "modal";
    const cats = [...new Set(allItems().map(y => y.cat).filter(Boolean))].sort();
    m.innerHTML = `<div class="sheet"><h2>${x.id ? "Edit " + esc(x.id) : "Add new"}</h2>
      <form id="ef"><div class="grid2">
        <label>Name<input name="name" value="${esc(x.name)}" required></label>
        <label>Type<select name="type">${TYPES.map(t => `<option ${t === (x.type || "Product") ? "selected" : ""}>${t}</option>`).join("")}</select></label>
        <label id="catf">${catField(x.type || "Product", x.cat, cats)}</label>
        <label>Customization<select name="custom">${CUSTOM.map(c => `<option ${c.toLowerCase() === String(x.custom || "").toLowerCase() ? "selected" : ""}>${c}</option>`).join("")}</select></label>
        <label>Sale price (Rs) — 0 = not set<input name="price" type="number" min="0" value="${x.price || 0}"></label>
        <label>Cost price (Rs)<input name="cost" type="number" min="0" value="${x.cost || ""}"></label>
        <label>Size (inches)<input name="size" value="${esc(x.size || "")}"></label>
        <label>Max items (boxes only)<input name="slots" type="number" min="0" value="${x.slots || ""}"></label>
      </div>
      <label style="margin-top:12px">Description (shown on the product page)<textarea name="desc" rows="3">${esc(x.desc || "")}</textarea></label>
      <label style="margin-top:12px">Drive folder link<input name="drive" value="${esc(x.drive || "")}"></label>
      <label style="margin-top:12px">Notes (only you see this)<input name="notes" value="${esc(x.notes || "")}"></label>
      <label style="margin-top:12px;display:flex;gap:8px;align-items:center"><input type="checkbox" name="show" style="width:auto" ${x.show ? "checked" : ""}> Show on website</label>
      <label id="ibf" style="margin-top:8px;display:${(x.type || "Product") === "Product" ? "flex" : "none"};gap:8px;align-items:center"><input type="checkbox" name="inbox" style="width:auto" ${x.inbox ? "checked" : ""}> Can go in a box (shows in Make Your Box)</label>
      <h3 style="margin-top:16px">Photos <small style="font-family:DM Sans;color:var(--mu)">(first photo is the main one)</small></h3><div class="gal" id="gl"></div>
      <label>Add photos<input type="file" id="up" accept="image/*" multiple></label><p id="upm" style="color:var(--mu);font-size:.85rem"></p>
      <div class="bar" style="margin-top:16px"><button class="btn" id="sv">Save</button><button type="button" class="btn ghost" id="cx">Cancel</button></div></form></div>`;
    document.body.appendChild(m);
    m.querySelector("[name=type]").onchange = e => { const c = m.querySelector("[name=cat]"); m.querySelector("#catf").innerHTML = catField(e.target.value, c ? c.value : "", cats); m.querySelector("#ibf").style.display = e.target.value === "Product" ? "flex" : "none"; };
    const drawG = () => { m.querySelector("#gl").innerHTML = g.map((r, i) => `<div><img src="${src(r)}" alt=""><button type="button" data-rm="${i}" title="Remove">×</button>${i ? `<button type="button" class="mv" data-mv="${i}" title="Make main">★</button>` : ""}</div>`).join("") || `<p style="color:var(--mu)">No photos yet.</p>`;
      m.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { g.splice(+b.dataset.rm, 1); drawG(); });
      m.querySelectorAll("[data-mv]").forEach(b => b.onclick = () => { const [it] = g.splice(+b.dataset.mv, 1); g.unshift(it); drawG(); }); };
    drawG();
    m.querySelector("#cx").onclick = () => m.remove();
    m.querySelector("#up").onchange = async e => {
      const fs = [...e.target.files], st = m.querySelector("#upm");
      for (let i = 0; i < fs.length; i++) {
        st.textContent = `Uploading ${i + 1} of ${fs.length}…`;
        const data64 = await shrink(fs[i]);
        const j = await call("admin_upload", { data: data64, type: "image/jpeg", name: (x.id || "new") + "-" + Date.now() + ".jpg", drive: m.querySelector("[name=drive]").value });
        if (j.ok) { g.push(j.id); drawG(); } else { st.textContent = j.error; return; }
      }
      st.textContent = "Uploaded. Press Save to keep them.";
    };
    m.querySelector("#ef").onsubmit = async e => {
      e.preventDefault(); const f = new FormData(e.target), b = m.querySelector("#sv"); b.disabled = true; b.textContent = "Saving…";
      const p = { id: x.id, name: f.get("name"), type: f.get("type"), cat: f.get("cat"), custom: f.get("custom"), price: +f.get("price") || 0, cost: +f.get("cost") || "",
        size: f.get("size"), slots: +f.get("slots") || "", desc: f.get("desc"), drive: f.get("drive"), notes: f.get("notes"), show: !!f.get("show"), inbox: f.get("type") === "Product" && !!f.get("inbox"), gallery: g };
      const j = await call("admin_save_product", { p });
      if (!j.ok) { alert(j.error); b.disabled = false; b.textContent = "Save"; return; }
      m.remove(); msg = `Saved ${j.id}. The website shows changes within 2 minutes.`; load();
    };
  }
  function shrink(file) { return new Promise(res => { const r = new FileReader(); r.onload = () => { const i = new Image(); i.onload = () => {
    const k = Math.min(1, 1600 / Math.max(i.width, i.height)), c = document.createElement("canvas"); c.width = Math.round(i.width * k); c.height = Math.round(i.height * k);
    c.getContext("2d").drawImage(i, 0, 0, c.width, c.height); res(c.toDataURL("image/jpeg", .88).split(",")[1]); }; i.src = r.result; }; r.readAsDataURL(file); }); }

  /* ---- ready boxes ---- */
  function renderReady() {
    shell(`<div class="bar"><h2 style="margin:0">Gift Boxes</h2><span style="flex:1"></span><button class="btn" id="add">+ Add ready box</button></div>
      <table><thead><tr><th></th><th>ID</th><th>Name</th><th>Box</th><th>Items</th><th>Website</th><th></th></tr></thead><tbody>${data.ready.map(r => `<tr class="${r.show ? "" : "off"}"><td>${gal(r)[0] ? `<img src="${src(gal(r)[0])}">` : ""}</td><td>${esc(r.id)}</td><td>${esc(r.name)}</td><td>${esc((allItems().find(x => x.id === r.box) || {}).name || r.box)}</td><td>${r.items.length}</td><td>${r.show ? "Shown" : "Hidden"}</td><td><button class="btn sm ghost" data-er="${esc(r.id)}">Edit</button></td></tr>`).join("")}</tbody></table>`);
    document.querySelectorAll("[data-er]").forEach(b => b.onclick = () => editReady(data.ready.find(r => r.id === b.dataset.er)));
    $("#add").onclick = () => editReady({ id: "", name: "", box: data.boxes[0] && data.boxes[0].id, items: [], desc: "", gallery: [], show: true });
  }
  function editReady(r) {
    let g = [...gal(r)]; const m = document.createElement("div"); m.className = "modal";
    m.innerHTML = `<div class="sheet"><h2>${r.id ? "Edit " + esc(r.name) : "New ready box"}</h2><form id="rf">
      <div class="grid2"><label>Name<input name="name" value="${esc(r.name)}" required></label>
      <label>Box<select name="box">${data.boxes.map(b => `<option value="${b.id}" ${b.id === r.box ? "selected" : ""}>${esc(b.name)} (${b.id})</option>`).join("")}</select></label></div>
      <h3 style="margin-top:14px">Items inside</h3><p style="color:var(--mu);font-size:.85rem;margin:0 0 8px">Products ticked "Can go in a box". Extras are added by the customer.</p><div class="items">${data.products.filter(f => f.inbox && f.show && !/^(extras|add-ons?)$/i.test(f.cat)).map(f => `<label><input type="checkbox" name="it" value="${f.id}" ${r.items.includes(f.id) ? "checked" : ""}>${esc(f.name)}</label>`).join("")}</div>
      <label style="margin-top:12px">Description<textarea name="desc" rows="3">${esc(r.desc)}</textarea></label>
      <label style="margin-top:12px;display:flex;gap:8px;align-items:center"><input type="checkbox" name="show" style="width:auto" ${r.show ? "checked" : ""}> Show on website</label>
      <h3 style="margin-top:14px">Photos</h3><div class="gal" id="gl"></div><label>Add photos<input type="file" id="up" accept="image/*" multiple></label><p id="upm"></p>
      <div class="bar"><button class="btn" id="sv">Save</button><button type="button" class="btn ghost" id="cx">Cancel</button></div></form></div>`;
    document.body.appendChild(m);
    const drawG = () => { m.querySelector("#gl").innerHTML = g.map((x, i) => `<div><img src="${src(x)}"><button type="button" data-rm="${i}">×</button></div>`).join(""); m.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { g.splice(+b.dataset.rm, 1); drawG(); }); };
    drawG(); m.querySelector("#cx").onclick = () => m.remove();
    m.querySelector("#up").onchange = async e => { for (const f of e.target.files) { m.querySelector("#upm").textContent = "Uploading…"; const j = await call("admin_upload", { data: await shrink(f), type: "image/jpeg", name: "ready-" + Date.now() + ".jpg" }); if (j.ok) { g.push(j.id); drawG(); } } m.querySelector("#upm").textContent = "Uploaded. Press Save."; };
    m.querySelector("#rf").onsubmit = async e => { e.preventDefault(); const f = new FormData(e.target);
      const j = await call("admin_save_ready", { r: { id: r.id, name: f.get("name"), box: f.get("box"), items: f.getAll("it"), desc: f.get("desc"), gallery: g, show: !!f.get("show") } });
      if (!j.ok) return alert(j.error); m.remove(); msg = "Ready box saved."; load(); };
  }

  /* ---- orders ---- */
  function renderOrders() {
    const ST = ["Confirmed", "Making", "Shipped", "Delivered", "Cancelled"], PAY = ["Pending", "Paid", "Partly paid", "Refunded"];
    shell(`<div class="stats">${ST.map(s => `<div class="card"><b>${orders.filter(o => (o.Status || "Confirmed") === s).length}</b>${s}</div>`).join("")}</div>
      <table><thead><tr><th>Order</th><th>Date</th><th>Sender</th><th>Receiver</th><th>Items</th><th>Total</th><th>Status</th><th>Payment</th></tr></thead><tbody>${orders.map(o => `<tr>
        <td><b>${esc(o["Order ID"])}</b></td><td>${esc(o["Order Date"])}</td><td>${esc(o["Sender Name"])}<br><small>${esc(o["Sender WhatsApp"])}</small></td>
        <td>${esc(o["Receiver Name"])}<br><small>${esc(o["Receiver City"])} · ${esc(o["Delivery Date"])}</small></td>
        <td style="white-space:pre-line;font-size:.82rem;max-width:320px">${esc(o.Items)}${o["Uploaded Photo Links"] ? `<br><a href="${esc(String(o["Uploaded Photo Links"]).split("\n")[0])}" target="_blank">Photos</a>` : ""}</td>
        <td>${o.Notes && /confirm/i.test(o.Notes) ? "To confirm" : "Rs " + esc(o["Grand Total"])}</td>
        <td><select data-os="${esc(o["Order ID"])}">${ST.map(s => `<option ${s === (o.Status || "Confirmed") ? "selected" : ""}>${s}</option>`).join("")}</select></td>
        <td><select data-op="${esc(o["Order ID"])}">${PAY.map(s => `<option ${s === (o["Payment Status"] || "Pending") ? "selected" : ""}>${s}</option>`).join("")}</select></td></tr>`).join("") || `<tr><td colspan=8>No orders yet.</td></tr>`}</tbody></table>`);
    document.querySelectorAll("[data-os]").forEach(s => s.onchange = async () => { const j = await call("admin_order_status", { id: s.dataset.os, status: s.value }); if (!j.ok) alert(j.error); });
    document.querySelectorAll("[data-op]").forEach(s => s.onchange = async () => { const j = await call("admin_order_status", { id: s.dataset.op, payment: s.value }); if (!j.ok) alert(j.error); });
  }

  /* ---- settings ---- */
  function renderSettings() {
    const s = data.settings;
    shell(`<div class="grid2"><form class="card" id="sf"><h3>Shop settings</h3>
        <label>WhatsApp number (with 92)<input name="whatsapp" value="${esc(s.whatsapp)}"></label>
        <label style="margin-top:10px">Delivery charge (Rs)<input name="delivery" type="number" value="${s.delivery}"></label>
        <label style="margin-top:10px">Free delivery above (Rs, 0 = never)<input name="freeAbove" type="number" value="${s.freeAbove || 0}"></label>
        <button class="btn" style="margin-top:14px">Save settings</button></form>
      <form class="card" id="pf"><h3>Login details</h3><p style="color:var(--mu);margin:0 0 12px;font-size:.9rem">Change your username, your password, or both. Password reset codes go to thegifthaveli@gmail.com.</p>
        <label>Username<input name="nu" value="${esc(adminUser)}" autocomplete="username" pattern="[A-Za-z0-9._-]{3,30}" required></label>
        <label style="margin-top:10px">New password (leave empty to keep it)<input type="password" name="np" minlength="8" autocomplete="new-password"></label>
        <label style="margin-top:10px">Current password (needed to save)<input type="password" name="cp" autocomplete="current-password" required></label>
        <button class="btn" style="margin-top:14px">Save login details</button></form></div>`);
    $("#sf").onsubmit = async e => { e.preventDefault(); const f = new FormData(e.target); const j = await call("admin_settings", { s: { whatsapp: f.get("whatsapp"), delivery: +f.get("delivery"), freeAbove: +f.get("freeAbove") } }); msg = j.ok ? "Settings saved." : j.error; load(); };
    $("#pf").onsubmit = async e => { e.preventDefault(); const f = new FormData(e.target), nu = f.get("nu").trim(), np = f.get("np");
      const j = await post("admin_account", { curPass: f.get("cp"), newUser: nu !== adminUser ? nu : "", newPass: np, remember: store.remembered() });
      if (j.ok) { adminUser = j.user; if (j.token) { token = j.token; store.set(token, store.remembered()); } try { if (localStorage.getItem("gh_user")) localStorage.setItem("gh_user", adminUser); } catch (x) {} msg = j.message; }
      else if (j.expired) { store.clear(); token = ""; return login({ text: j.error }); }
      else msg = j.error;
      render(); };
  }

  (async () => { if (!token) return login();
    const j = await post("admin_session"); if (!j.ok) { store.clear(); token = ""; return login(j.expired ? { text: j.error } : null); }
    adminUser = j.user; load(); })();
})();
</script>
</body>
</html>
